name: Reconcile Goose feature branch
on:
  push:
    branches: [chore/goose-source-delivery-20261012]
    paths: [.github/workflows/goose-reconcile-main.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'CompleteTech-LLC/ai-usage-ledger-skill' && github.ref == 'refs/heads/chore/goose-source-delivery-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/goose-ledger-integration-20261012
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce reviewed conflict resolutions and verify exact tree
        run: |
          test "$(git rev-parse HEAD)" = 8459dc4b81b9fef34995d40834eb385c9af1eded
          test "$(git rev-parse origin/main)" = 4948b232daf24c20669cd82f98d3656ffcb130dd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main || test -n "$(git diff --name-only --diff-filter=U)"
          python - <<'PY'
          import re
          from pathlib import Path
          files = ['references/discovery.md', 'references/harness-catalog.md', 'references/log-formats.md', 'scripts/compile_ai_logs.py', 'scripts/ledger.py', 'scripts/run_pipeline.py', 'scripts/validate_quality.py']
          pattern = r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> origin/main\n'
          counts = [1, 1, 1, 4, 1, 3, 1]
          for name, count in zip(files, counts):
              path = Path(name)
              text = path.read_text()
              assert len(re.findall(pattern, text, re.S)) == count, name
              def resolve(m):
                  ours, theirs = m.groups()
                  if name in ('references/discovery.md', 'references/log-formats.md'):
                      return theirs + '\n' + ours
                  if name == 'references/harness-catalog.md':
                      return ''.join(line for line in theirs.splitlines(True) if line.startswith('| mini-SWE-agent |')) + ours
                  if name == 'scripts/compile_ai_logs.py' and 'with open(path' in ours:
                      return theirs
                  if name == 'scripts/ledger.py':
                      return theirs.replace('"mini-swe-agent": ["mini_swe_roots"]', '"mini-swe-agent": ["mini_swe_roots"], "goose": ["goose_roots"]')
                  if name == 'scripts/run_pipeline.py' and '"vibe_roots"' in ours:
                      if '--vibe-root' in ours:
                          return theirs.replace('("mini_swe_roots", "--mini-swe-root")', '("mini_swe_roots", "--mini-swe-root"), ("goose_roots", "--goose-root")')
                      return theirs.replace('"mini_swe_roots",', '"mini_swe_roots", "goose_roots",')
                  if name == 'scripts/validate_quality.py':
                      return theirs.replace('"test_package_mini_swe.py"', '"test_package_mini_swe.py", "test_goose*.py"')
                  return theirs + ours
              path.write_text(re.sub(pattern, resolve, text, flags=re.S))
          PY
          git add --all
          git diff --cached --check
          test "$(git write-tree)" = 504d78168203da6b11915b7895b9f85fc7e87b68
      - name: Verify both native integrations and lint
        run: |
          python -m pip install ruff
          ruff check scripts tests
          python -m unittest discover -s tests -p 'test_goose*.py' -v
          python -m unittest discover -s tests -p 'test_package_mini_swe*.py' -v
          python scripts/validate_package.py
      - name: Publish only a normal fast-forward on the feature branch
        run: |
          test "$(git write-tree)" = 504d78168203da6b11915b7895b9f85fc7e87b68
          git commit -m 'Merge current main into Goose integration, preserving mini-SWE registration and tests'
          git push origin HEAD:refs/heads/feat/goose-ledger-integration-20261012
          git log -1 --format='%H %s'
