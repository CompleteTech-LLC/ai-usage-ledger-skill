name: mini-SWE integration preflight
on:
  push:
    branches: [feat/mini-swe-usage-20261012]
    paths: ['.github/workflows/mini-swe-preflight.yml', '.mini-swe-staging/**']
permissions:
  contents: read
jobs:
  publish-signed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: stage
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e9d5e225a802d8eddcc7e1a2fc72cded6db1437e
          path: ledger
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified patch and run package tests
        working-directory: ledger
        run: |
          python ../stage/.mini-swe-staging/apply.py
          python -m unittest discover -s tests -p 'test_package_*.py' -v
          python scripts/validate_package.py
      - name: Publish signed source to the isolated feature branch only
        working-directory: ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../stage/.mini-swe-staging/publish.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-swe-signed-publication
          path: ${{ runner.temp }}/mini-swe-published.json
          if-no-files-found: warn
          retention-days: 7
  native-and-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MSWEA_SILENT_STARTUP: '1'
      MSWEA_MODEL_RETRY_STOP_AFTER_ATTEMPT: '2'
      PORTKEY_API_KEY: synthetic-not-a-provider-key
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - name: Configure isolated test paths
        run: |
          echo "MSWEA_GLOBAL_CONFIG_DIR=$RUNNER_TEMP/mini-swe-test-config" >> "$GITHUB_ENV"
          echo "MINI_SWE_TEST_RECEIPTS=$RUNNER_TEMP/mini-swe-receipts" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/mini-swe-receipts"
      - uses: actions/checkout@v4
        with:
          path: stage
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e9d5e225a802d8eddcc7e1a2fc72cded6db1437e
          path: ledger
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SWE-agent/mini-swe-agent
          ref: 04d809ceab9df28f9adaed044884180159172930
          path: mini
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified patch
        working-directory: ledger
        run: python ../stage/.mini-swe-staging/apply.py
      - name: Install native test dependencies
        run: |
          python -m pip install -e 'mini[dev]' 'litellm==1.96.0'
          python -m pip freeze > "$MINI_SWE_TEST_RECEIPTS/environment.txt"
      - name: Run actual adapters and deterministic agent reconciliation
        working-directory: ledger
        run: python -m pytest tests/test_mini_swe_native.py -v --junitxml="$MINI_SWE_TEST_RECEIPTS/native.xml"
      - name: Run complete unchanged upstream suite without paid fire tests
        if: success() || failure()
        working-directory: mini
        run: python -m pytest -n auto --junitxml="$MINI_SWE_TEST_RECEIPTS/upstream.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-swe-native-and-upstream
          path: ${{ runner.temp }}/mini-swe-receipts
          if-no-files-found: warn
          retention-days: 7
