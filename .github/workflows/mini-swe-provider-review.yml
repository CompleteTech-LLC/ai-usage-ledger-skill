name: mini-SWE provider identity review repair
on:
  push:
    branches: [work/mini-swe-provider-review-20261012]
    paths: ['.mini-swe-review/**', '.github/workflows/mini-swe-provider-review.yml']
permissions:
  contents: read
jobs:
  validate-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: stage
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3f7ca1e5d0528670ec326ef6f59e7398a34537b5
          path: ledger
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match existing package-test conventions for imports after script-path setup
        working-directory: ledger
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_package_mini_swe_identity.py')
          text = path.read_text(encoding='utf-8')
          for line in ('import compile_ai_logs as scanner', 'import ledger_store', 'import mini_swe_usage as usage'):
              assert text.count(line + '\n') == 1
              text = text.replace(line + '\n', line + '  # noqa: E402\n')
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install 'ruff==0.14.0'
      - name: Run lint, all package tests, package contract and original parser fixtures
        working-directory: ledger
        run: |
          set -o pipefail
          ruff check .
          python -m unittest discover -s tests -p 'test_package_*.py' -v 2>&1 | tee "$RUNNER_TEMP/mini-swe-lint-tests.txt"
          python scripts/validate_package.py
          python tests/make_fixtures.py
          git diff --check
      - name: Publish verified GitHub-signed single-file cleanup to isolated fix branch
        working-directory: ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../stage/.mini-swe-review/publish_lint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-swe-lint-evidence
          path: |
            ${{ runner.temp }}/mini-swe-lint-tests.txt
            ${{ runner.temp }}/mini-swe-lint-publication.json
          if-no-files-found: warn
          retention-days: 7
