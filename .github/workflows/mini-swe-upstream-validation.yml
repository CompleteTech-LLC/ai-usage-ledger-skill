name: mini-SWE upstream validation
on:
  push:
    branches: [feat/mini-swe-usage-20261012]
    paths: ['.github/workflows/mini-swe-upstream-validation.yml']
permissions:
  contents: read
jobs:
  upstream-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SWE-agent/mini-swe-agent
          ref: 04d809ceab9df28f9adaed044884180159172930
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install upstream's full test extras
        run: |
          python -m pip install -e '.[full]' 'litellm==1.96.0'
          mkdir -p "$RUNNER_TEMP/upstream-receipts"
          python -m pip freeze > "$RUNNER_TEMP/upstream-receipts/environment.txt"
      - name: Run full unchanged suite with paid fire tests disabled by upstream defaults
        run: python -m pytest -v --cov --cov-branch --cov-report=xml -n auto --junitxml="$RUNNER_TEMP/upstream-receipts/upstream.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-swe-upstream-full
          path: ${{ runner.temp }}/upstream-receipts
          retention-days: 7
          if-no-files-found: warn
