name: Publish verified Muse review correction
on:
  push:
    branches: [work/muse-ledger-baseline-20261012]
    paths: [.github/workflows/muse-publish-verified.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc71e142ab6d3ab1794e5ac290992a003268ebc9
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the narrowly scoped reviewed correction
        run: |
          test "$(git ls-remote origin refs/heads/feat/muse-mesh-usage-mcp-20261012 | cut -f1)" = dc71e142ab6d3ab1794e5ac290992a003268ebc9
          git switch -c muse-completion-review
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          path = Path('scripts/muse_usage.py')
          text = path.read_text()
          old = '                                           "charge_source", "estimated_usage")}'
          new = '                                           "charge_source", "estimated_usage", "status", "usage_pricing_eligible")}'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          path = Path('tests/test_muse_usage.py')
          text = path.read_text()
          needle = '    def test_inflight_marker_is_coverage_not_a_zero_cost_event(self):\n'
          new = '''    def test_completion_status_change_conflicts_after_ingestion(self):
              for status in ("interrupted", "failed", "cancelled"):
                  for reverse in (False, True):
                      with self.subTest(status=status, reverse=reverse):
                          original = fixture(status=status)
                          completed = dict(original, invocation_id=str(uuid.uuid4()), status="completed")
                          first, second = (completed, original) if reverse else (original, completed)
                          first, second = (mu.normalize(row, self.source) for row in (first, second))
                          self.assertEqual(first["request_id"], second["request_id"])
                          self.assertNotEqual(first["evidence_sha256"], second["evidence_sha256"])
                          self.assertNotEqual(first["usage_pricing_eligible"], second["usage_pricing_eligible"])
                          path = str(self.root / (status + str(reverse) + ".sqlite"))
                          store = ledger_store.Store.open("sqlite", path)
                          try:
                              self.assertEqual(store.ingest_verified_events([first]), (1, 0))
                          finally:
                              store.close()
                          store = ledger_store.Store.open("sqlite", path)
                          try:
                              extra = mu.normalize(fixture(response_id="d" * 64), self.source)
                              with self.assertRaisesRegex(ValueError, "conflicting"):
                                  store.ingest_verified_events([extra, second])
                              rows = list(store.iter_events())
                              self.assertEqual(len(rows), 1)
                              self.assertEqual(rows[0]["status"], first["status"])
                              self.assertEqual(rows[0]["usage_pricing_eligible"], first["usage_pricing_eligible"])
                              self.assertEqual(store.ingest_verified_events([first]), (0, 1))
                          finally:
                              store.close()
          
              def test_completion_status_change_conflicts_in_first_batch(self):
                  for status in ("interrupted", "failed", "cancelled"):
                      for reverse in (False, True):
                          with self.subTest(status=status, reverse=reverse):
                              original = fixture(status=status)
                              completed = dict(original, invocation_id=str(uuid.uuid4()), status="completed")
                              records = [completed, original] if reverse else [original, completed]
                              path = str(self.root / (status + str(reverse) + ".sqlite"))
                              store = ledger_store.Store.open("sqlite", path)
                              try:
                                  with self.assertRaisesRegex(ValueError, "conflicting"):
                                      store.ingest_verified_events([mu.normalize(row, self.source) for row in records])
                                  self.assertEqual(list(store.iter_events()), [])
                              finally:
                                  store.close()
          
          '''
          # Align the embedded fixture with the checked-in class indentation.
          lines = new.splitlines(keepends=True)
          new = lines[0] + ''.join(line[4:] if line.startswith('    ') else line for line in lines[1:])
          assert text.count(needle) == 1
          path.write_text(text.replace(needle, new + needle))
          path = Path('references/muse-mesh.md')
          text = path.read_text()
          old = 'A separate SHA-256 fingerprint binds model, observed counts, input semantics and'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'A separate SHA-256 fingerprint binds completion status, pricing eligibility,\ncapture completeness, model, observed counts, input semantics and'))
          diff = subprocess.check_output(['git', 'diff', '--', 'scripts/muse_usage.py', 'tests/test_muse_usage.py', 'references/muse-mesh.md'])
          assert hashlib.sha256(diff).hexdigest() == '326a1f64d61f45aae84642f6c209ba28b7fd296f43a365792a0d7f0a9a21a6c9', 'Review diff mismatch'
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == {'scripts/muse_usage.py', 'tests/test_muse_usage.py', 'references/muse-mesh.md'}
          PY
      - name: Test before publishing the correction
        run: |
          python -m unittest discover -s tests -p 'test_muse_usage.py' -v
          python -m unittest discover -s tests -p 'test_ledger_mcp.py' -v
          python -m unittest discover -s tests -p 'test_package_*.py' -v
          python scripts/validate_package.py
          git diff --check
      - name: Commit and normal fast-forward push to reviewed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/muse_usage.py tests/test_muse_usage.py references/muse-mesh.md
          git commit -m 'fix: reject native replay with changed completion or pricing eligibility'
          mkdir evidence
          git rev-parse HEAD > evidence/ledger-head.sha
          git rev-parse HEAD^{tree} > evidence/ledger-tree.sha
          git bundle create evidence/ledger-reviewed.bundle HEAD
          git push origin HEAD:refs/heads/feat/muse-mesh-usage-mcp-20261012
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muse-reviewed-source
          path: evidence/
          retention-days: 1
