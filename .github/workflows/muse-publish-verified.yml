name: Publish verified Muse review correction
on:
  push:
    branches: [work/muse-ledger-baseline-20261012]
    paths: [.github/workflows/muse-publish-verified.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc71e142ab6d3ab1794e5ac290992a003268ebc9
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the exact locally tested review correction
        run: |
          test "$(git ls-remote origin refs/heads/feat/muse-mesh-usage-mcp-20261012 | cut -f1)" = dc71e142ab6d3ab1794e5ac290992a003268ebc9
          git switch -c muse-completion-review
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '326a1f64d61f45aae84642f6c209ba28b7fd296f43a365792a0d7f0a9a21a6c9'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == {'scripts/muse_usage.py', 'tests/test_muse_usage.py', 'references/muse-mesh.md'}
          PY
      - name: Test before publishing the correction
        run: |
          python -m unittest discover -s tests -p 'test_muse_usage.py' -v
          python -m unittest discover -s tests -p 'test_ledger_mcp.py' -v
          python -m unittest discover -s tests -p 'test_package_*.py' -v
          python scripts/validate_package.py
          git diff --check
      - name: Commit and normal fast-forward push to reviewed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/muse_usage.py tests/test_muse_usage.py references/muse-mesh.md
          git commit -m 'fix: reject native replay with changed completion or pricing eligibility'
          mkdir evidence
          git rev-parse HEAD > evidence/ledger-head.sha
          git rev-parse HEAD^{tree} > evidence/ledger-tree.sha
          git bundle create evidence/ledger-reviewed.bundle HEAD
          git push origin HEAD:refs/heads/feat/muse-mesh-usage-mcp-20261012
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muse-reviewed-source
          path: evidence/
          retention-days: 1
